# config.yaml
llm:
  model: "google_genai:gemini-2.5-flash"
  temperature: 0

llm_fast:
  model: "google_genai:gemini-3.1-flash-lite-preview"
  temperature: 0

databases:
  - name: "Chinook"
    dialect: "sqlite"
    description: ${db_descriptions.Chinook}
    limit: 5

  - name: "Northwind"
    dialect: "sqlite"
    description: ${db_descriptions.Northwind}
    limit: 5

retrieval:
  embedding_model: "google_genai:gemini-embedding-001"
  persist_directory: "data/chroma_schema"
  schemas_directory: "data/schemas"
  top_k: 8

memory:
  enabled: true

langsmith:
  tracing: true

cache:
  enabled: false
  redis_url: "redis://redis:6379"
  distance_threshold: 0.10
  ttl: 86400 # 24h 