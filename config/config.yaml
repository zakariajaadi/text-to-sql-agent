# config.yaml
llm:
  model: "google_genai:gemini-2.5-flash"
  temperature: 0

llm_fast:
  model: "google_genai:gemini-3.1-flash-lite-preview"
  temperature: 0

databases:
  - name: "Chinook"
    dialect: "hive"
    max_rows: 100
    tagline: "A digital music store: artists, albums, tracks, customers and invoices."  # Optional
    starters:  # Optional: example questions of the welcome screen (icon: public/icons/<icon>.svg)
      - {icon: kpi,  question: "What is the total revenue of all invoices?"}
      - {icon: line, question: "What was the total revenue per month in 2023?"}
      - {icon: bar,  question: "How many tracks are there per genre?"}
      - {icon: rank, question: "Who are the top 5 artists by number of albums?"}
  - name: "Northwind"
    dialect: "hive"
    max_rows: 100
    tagline: "A food trading company: products, suppliers, customers, orders and employees."
    starters:
      - {icon: kpi,  question: "How many orders were placed in 2022?"}
      - {icon: line, question: "What is the monthly revenue trend for 2022?"}
      - {icon: bar,  question: "What is the total revenue per category?"}
      - {icon: rank, question: "Who are the top 5 employees by total revenue generated?"}


retrieval:
  embedding_model: "google_genai:gemini-embedding-001"
  persist_directory: "data/chroma_schema"
  schemas_directory: "data/schemas"
  top_k: 8
  fk_neighbors: false   # FK expansion pass 1: add all direct neighbors of selected tables
  
column_pruning:
  enabled: true
  min_columns: 25   # only tables with more columns are sent to the LLM, narrower ones are kept whole

memory:
  enabled: true

langsmith:
  tracing: true

cache:
  enabled: false
  redis_url: "redis://redis:6379"
  distance_threshold: 0.10
  ttl: 86400 # 24h 