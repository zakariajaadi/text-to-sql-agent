# config.yaml
llm:
  model: "google_genai:gemini-2.5-flash"
  temperature: 0

llm_fast:
  model: "google_genai:gemini-3.1-flash-lite-preview"
  temperature: 0

databases:
  - name: "Chinook"
    dialect: "hive"
    max_rows: 100
    tagline: "Un magasin de musique en ligne : artistes, albums, morceaux, clients et factures."  # Optional
    starters:  # Optional: example questions of the welcome screen (icon: public/icons/<icon>.svg)
      - {icon: kpi,  question: "Quel est le chiffre d'affaires total ?"}
      - {icon: line, question: "Chiffre d'affaires par mois en 2023 ?"}
      - {icon: bar,  question: "Combien de morceaux par genre ?"}
      - {icon: pie,  question: "Répartition des morceaux par genre"}
      - {icon: rank, question: "Top 5 des artistes par nombre d'albums ?"}
  - name: "Northwind"
    dialect: "hive"
    max_rows: 100
    tagline: "Une entreprise de négoce alimentaire : produits, fournisseurs, clients, commandes et employés."
    starters:
      - {icon: kpi,  question: "Combien de commandes en 2022 ?"}
      - {icon: line, question: "Chiffre d'affaires mensuel en 2022 ?"}
      - {icon: bar,  question: "Chiffre d'affaires par catégorie ?"}
      - {icon: rank, question: "Top 5 des employés par chiffre d'affaires ?"}


retrieval:
  embedding_model: "google_genai:gemini-embedding-001"
  persist_directory: "data/chroma_schema"
  schemas_directory: "data/schemas"
  top_k: 8
  fk_neighbors: false   # FK expansion pass 1: add all direct neighbors of selected tables
  
column_pruning:
  enabled: true
  min_columns: 25   # only tables with more columns are sent to the LLM, narrower ones are kept whole

memory:
  enabled: true

langsmith:
  tracing: true

cache:
  enabled: false
  redis_url: "redis://redis:6379"
  distance_threshold: 0.10
  ttl: 86400 # 24h 