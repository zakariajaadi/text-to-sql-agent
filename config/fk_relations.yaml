# Declarative FK relations, for engines that expose no FK metadata (Hive, Impala).
# Generated by LLM (schema_indexer fk-relations), then reviewed manually:
#   - the generator only ADDS relations, never modifies or removes existing ones
#   - to reject a generated relation, move it to `ignore` (otherwise it comes back)
# Table and column names must match the engine (lowercase for Hive).

Chinook:
  relations:
  - {from: album.artistid, to: artist.artistid}
  - {from: customer.supportrepid, to: employee.employeeid}
  - {from: employee.reportsto, to: employee.employeeid}
  - {from: invoice.customerid, to: customer.customerid}
  - {from: invoiceline.invoiceid, to: invoice.invoiceid}
  - {from: invoiceline.trackid, to: track.trackid}
  - {from: playlisttrack.playlistid, to: playlist.playlistid}
  - {from: playlisttrack.trackid, to: track.trackid}
  - {from: track.albumid, to: album.albumid}
  - {from: track.mediatypeid, to: mediatype.mediatypeid}
  - {from: track.genreid, to: genre.genreid}
  - {from: customer_cdc.customerid, to: customer.customerid}
  - {from: customer_snapshot.customerid, to: customer.customerid}
  - {from: customer_snapshot.supportrepid, to: employee.employeeid}
  - {from: invoice_delta.invoiceid, to: invoice.invoiceid}
  - {from: invoice_delta.customerid, to: customer.customerid}
  ignore: []
