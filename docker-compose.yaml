services:
  # Redis for caching
  redis:
    image: redis/redis-stack:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Chainlit app
  app:
    build: .
    image: text-to-sql-dev
    container_name: chainlit-app
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src        # bind mount — live reload
      - ./data:/app/data      # chroma
      - ./config:/app/config  # config.yaml
      - ./semantic_layer:/app/semantic_layer  # tables, relationships
      - ./app.py:/app/app.py
      - ./.chainlit:/app/.chainlit    # Chainlit config and translations
      - ./public:/app/public          # custom CSS, elements, icons
      - ./chainlit.md:/app/chainlit.md
    env_file:
      - .env
    environment:
      HIVE_HOST: hive         # service name — "localhost" would be the app container itself
    depends_on:
      redis:
        condition: service_started
      hive:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Studio of the semantic layer (offline/studio): the same image as the app, on its own port.
  # It runs the pipeline steps in its container and writes semantic_layer/ like the CLI.
  #   docker compose up -d studio             # studio on http://localhost:8100 (not with `make studio`: same port)
  studio:
    build: .
    image: text-to-sql-dev
    container_name: studio
    command: ["python", "-m", "uvicorn", "offline.studio.app:app", "--host", "0.0.0.0", "--port", "8100",
              "--reload", "--reload-dir", "offline/studio"]
    ports:
      - "8100:8100"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./semantic_layer:/app/semantic_layer  # written by the generators
      - ./offline:/app/offline                # generators, indexer, eval (not in the image)
    env_file:
      - .env
    environment:
      HIVE_HOST: hive
    depends_on:
      hive:
        condition: service_healthy


  # Hive (HiveServer2 + embedded metastore) for local dev
  hive:
    image: apache/hive:4.0.1
    container_name: hive
    environment:
      SERVICE_NAME: hiveserver2
      # Keep the metastore (table catalog) on the warehouse volume, so it survives `docker compose down`
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/opt/hive/data/warehouse/metastore_db;create=true"
    ports:
      - "10000:10000"   # HiveServer2 (thrift)
      - "10002:10002"   # web UI
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "beeline -u jdbc:hive2://localhost:10000 -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
  

volumes:
  redis_data:
  hive_warehouse: