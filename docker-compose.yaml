services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: chainlit-app
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src        # bind mount — live reload
      - ./data:/app/data      # databases + chroma
      - ./config:/app/config  # config.yaml + db_descriptions.yaml
      - ./app.py:/app/app.py 
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  redis_data: