# benchmarks/northwind.yaml
# ==========================
# Benchmark dataset for evaluating the Text-to-SQL agent on Northwind DB.
#
# Each entry contains:
#   - question: Natural language question (as a user would ask)
#   - difficulty: simple | medium | hard
#   - category: The SQL skill being tested
#   - expected_tables: Tables the agent should select
#   - accepted_queries: One or more valid SQL answers
#   - expected_row_count: (optional) Expected number of rows in the result
#   - notes: (optional) Why this question is tricky
#   - compare: (optional) judge — several presentations are equally right (band labels, an
#     "unknown" group or not): the rows are not compared, only the LLM judge scores it
#
# Guidelines for adding questions:
#   - Cover all tables in the schema
#   - Include at least 2 accepted_queries when multiple valid approaches exist
#   - Use difficulty levels consistently:
#       simple  = 1-2 tables, basic SELECT/WHERE/ORDER BY
#       medium  = 2-3 tables, JOINs, GROUP BY, HAVING
#       hard    = 3+ tables, subqueries, window functions, ambiguity

# ── Simple (1-2 tables, basic operations) ─────────────────────────────────────

- question: "How many products are there?"
  difficulty: simple
  category: count
  expected_tables: [Products]
  accepted_queries:
    - "SELECT COUNT(*) FROM Products"
    - "SELECT COUNT(ProductID) FROM Products"

- question: "How many customers are there?"
  difficulty: simple
  category: count
  expected_tables: [Customers]
  accepted_queries:
    - "SELECT COUNT(*) FROM Customers"
    - "SELECT COUNT(CustomerID) FROM Customers"

- question: "Which products are discontinued?"
  difficulty: simple
  category: filtering
  expected_tables: [Products]
  accepted_queries:
    - "SELECT ProductName FROM Products WHERE Discontinued = 1"
    - "SELECT ProductID, ProductName FROM Products WHERE Discontinued = 1"

- question: "What is the most expensive product?"
  difficulty: simple
  category: aggregation
  expected_tables: [Products]
  accepted_queries:
    - "SELECT ProductName, UnitPrice FROM Products ORDER BY UnitPrice DESC LIMIT 1"

- question: "Which suppliers are from Germany?"
  difficulty: simple
  category: filtering
  expected_tables: [Suppliers]
  accepted_queries:
    - "SELECT CompanyName FROM Suppliers WHERE Country = 'Germany'"
    - "SELECT CompanyName, City FROM Suppliers WHERE Country = 'Germany'"

- question: "How many orders were placed in 1997?"
  difficulty: simple
  category: date_filter
  expected_tables: [Orders]
  accepted_queries:
    - "SELECT COUNT(*) FROM Orders WHERE year(OrderDate) = 1997"
    - "SELECT COUNT(*) FROM Orders WHERE OrderDate BETWEEN '1997-01-01' AND '1997-12-31'"
    - "SELECT COUNT(*) FROM Orders WHERE OrderDate LIKE '1997%'"

# ── Medium (2-3 tables, JOINs, GROUP BY) ──────────────────────────────────────

- question: "How many products does each category have?"
  difficulty: medium
  category: join_aggregation
  expected_tables: [Categories, Products]
  accepted_queries:
    - >
      SELECT c.CategoryName, COUNT(p.ProductID) AS ProductCount
      FROM Categories c JOIN Products p ON c.CategoryID = p.CategoryID
      GROUP BY c.CategoryName ORDER BY ProductCount DESC
    - >
      SELECT c.CategoryName, COUNT(*) AS ProductCount
      FROM Categories c JOIN Products p ON c.CategoryID = p.CategoryID
      GROUP BY c.CategoryID, c.CategoryName ORDER BY ProductCount DESC

- question: "Which categories have more than 10 products?"
  difficulty: medium
  category: having_filter
  expected_tables: [Categories, Products]
  accepted_queries:
    - >
      SELECT c.CategoryName, COUNT(p.ProductID) AS ProductCount
      FROM Categories c JOIN Products p ON c.CategoryID = p.CategoryID
      GROUP BY c.CategoryID, c.CategoryName HAVING COUNT(p.ProductID) > 10
      ORDER BY ProductCount DESC
    - >
      SELECT c.CategoryName
      FROM Categories c JOIN Products p ON c.CategoryID = p.CategoryID
      GROUP BY c.CategoryID, c.CategoryName HAVING COUNT(p.ProductID) > 10
  notes: "A filter on an aggregate: it belongs in HAVING, not in WHERE."

- question: "Which customers have placed the most orders?"
  difficulty: medium
  category: join_aggregation
  expected_tables: [Customers, Orders]
  accepted_queries:
    - >
      SELECT c.CompanyName, COUNT(o.OrderID) AS OrderCount
      FROM Customers c JOIN Orders o ON c.CustomerID = o.CustomerID
      GROUP BY c.CustomerID, c.CompanyName ORDER BY OrderCount DESC LIMIT 5

- question: "What is the total revenue per product?"
  difficulty: medium
  category: join_aggregation
  expected_tables: [Products, order_details]
  accepted_queries:
    - >
      SELECT p.ProductName, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS Revenue
      FROM Products p JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY p.ProductID, p.ProductName ORDER BY Revenue DESC
    - >
      SELECT p.ProductName, ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) AS Revenue
      FROM Products p JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY p.ProductName ORDER BY Revenue DESC

- question: "Which employees have handled the most orders?"
  difficulty: medium
  category: join_aggregation
  expected_tables: [Employees, Orders]
  accepted_queries:
    - >
      SELECT e.FirstName, e.LastName, COUNT(o.OrderID) AS OrderCount
      FROM Employees e JOIN Orders o ON e.EmployeeID = o.EmployeeID
      GROUP BY e.EmployeeID, e.FirstName, e.LastName ORDER BY OrderCount DESC LIMIT 5

- question: "What are the top 5 countries by number of customers?"
  difficulty: medium
  category: aggregation
  expected_tables: [Customers]
  accepted_queries:
    - >
      SELECT Country, COUNT(CustomerID) AS CustomerCount
      FROM Customers GROUP BY Country ORDER BY CustomerCount DESC LIMIT 5

- question: "Which shippers have delivered the most orders?"
  difficulty: medium
  category: join_aggregation
  expected_tables: [Shippers, Orders]
  accepted_queries:
    - >
      SELECT s.CompanyName, COUNT(o.OrderID) AS OrderCount
      FROM Shippers s JOIN Orders o ON s.ShipperID = o.ShipVia
      GROUP BY s.ShipperID, s.CompanyName ORDER BY OrderCount DESC

# ── Hard (3+ tables, subqueries, master/detail) ──────────────────────────────

- question: "What is the total revenue per category?"
  difficulty: hard
  category: multi_join_aggregation
  expected_tables: [Categories, Products, order_details]
  accepted_queries:
    - >
      SELECT c.CategoryName, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS Revenue
      FROM Categories c
      JOIN Products p ON c.CategoryID = p.CategoryID
      JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY c.CategoryName ORDER BY Revenue DESC
    - >
      SELECT c.CategoryName, ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) AS Revenue
      FROM Categories c
      JOIN Products p ON c.CategoryID = p.CategoryID
      JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY c.CategoryID, c.CategoryName ORDER BY Revenue DESC

- question: "What is the average order value by country?"
  difficulty: hard
  category: nested_aggregation
  expected_tables: [Orders, order_details]
  accepted_queries:
    - >
      WITH OrderTotals AS (
        SELECT o.OrderID, o.ShipCountry,
               SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS OrderTotal
        FROM Orders o
        JOIN order_details od ON o.OrderID = od.OrderID
        GROUP BY o.OrderID, o.ShipCountry
      )
      SELECT ShipCountry, AVG(OrderTotal) AS AvgOrderValue
      FROM OrderTotals
      GROUP BY ShipCountry
      ORDER BY AvgOrderValue DESC
  notes: >
    Tests master/detail aggregation: must first sum line items
    per order, then average per country. Common error is averaging
    line items directly.

- question: "What is the average order value per customer?"
  difficulty: hard
  category: nested_aggregation
  expected_tables: [Customers, Orders, order_details]
  accepted_queries:
    - >
      WITH OrderTotals AS (
        SELECT o.OrderID, o.CustomerID,
               SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS OrderTotal
        FROM Orders o
        JOIN order_details od ON o.OrderID = od.OrderID
        GROUP BY o.OrderID, o.CustomerID
      )
      SELECT c.CompanyName, AVG(ot.OrderTotal) AS AvgOrderValue
      FROM Customers c
      JOIN OrderTotals ot ON c.CustomerID = ot.CustomerID
      GROUP BY c.CustomerID, c.CompanyName
      ORDER BY AvgOrderValue DESC
  notes: >
    Same master/detail pattern: aggregate line items to order level first,
    then average per customer.

- question: "What is the average number of items per order?"
  difficulty: hard
  category: nested_aggregation
  expected_tables: [order_details]
  accepted_queries:
    - >
      WITH OrderItemCounts AS (
        SELECT OrderID, SUM(Quantity) AS TotalItems
        FROM order_details
        GROUP BY OrderID
      )
      SELECT AVG(TotalItems) AS AvgItemsPerOrder
      FROM OrderItemCounts
    - >
      SELECT AVG(ItemCount) FROM (
        SELECT OrderID, SUM(Quantity) AS ItemCount
        FROM order_details GROUP BY OrderID
      ) AS order_items
  notes: >
    Must count items per order first, then average.
    Common error is AVG(Quantity) directly on Order Details.

- question: "Which supplier has generated the most revenue?"
  difficulty: hard
  category: multi_join_aggregation
  expected_tables: [Suppliers, Products, order_details]
  accepted_queries:
    - >
      SELECT s.CompanyName, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS Revenue
      FROM Suppliers s
      JOIN Products p ON s.SupplierID = p.SupplierID
      JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY s.SupplierID, s.CompanyName ORDER BY Revenue DESC LIMIT 1

- question: "Which customers have never placed an order?"
  difficulty: hard
  category: anti_join
  expected_tables: [Customers, Orders]
  accepted_queries:
    - >
      SELECT c.CompanyName FROM Customers c
      LEFT JOIN Orders o ON c.CustomerID = o.CustomerID
      WHERE o.OrderID IS NULL
    - >
      SELECT CompanyName FROM Customers
      WHERE CustomerID NOT IN (SELECT CustomerID FROM Orders)

- question: "What percentage of total revenue does each category represent?"
  difficulty: hard
  category: ratio
  expected_tables: [Categories, Products, order_details]
  compare: judge
  accepted_queries:
    - >
      SELECT c.CategoryName,
             ROUND(100 * SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) /
                   SUM(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount))) OVER (), 2) AS RevenueShare
      FROM Categories c
      JOIN Products p ON c.CategoryID = p.CategoryID
      JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY c.CategoryID, c.CategoryName ORDER BY RevenueShare DESC
  notes: >
    A share of a total: the denominator is the revenue of every category (a window
    SUM or a subquery), never the group's own. Judge-scored: percent or fraction,
    rounded or not, are equally right.

- question: "For each customer, how many orders did they place in 1997, including customers with none?"
  difficulty: hard
  category: left_join_filter
  expected_tables: [Customers, Orders]
  accepted_queries:
    - >
      SELECT c.CompanyName, COUNT(o.OrderID) AS Orders1997
      FROM Customers c
      LEFT JOIN Orders o ON o.CustomerID = c.CustomerID AND year(o.OrderDate) = 1997
      GROUP BY c.CustomerID, c.CompanyName ORDER BY Orders1997 DESC
    - >
      SELECT c.CompanyName, COALESCE(o.Orders1997, 0) AS Orders1997
      FROM Customers c
      LEFT JOIN (SELECT CustomerID, COUNT(OrderID) AS Orders1997
                 FROM Orders WHERE year(OrderDate) = 1997 GROUP BY CustomerID) o
        ON o.CustomerID = c.CustomerID
      ORDER BY Orders1997 DESC
  notes: >
    The year filter belongs in the ON clause or a subquery: in the WHERE it turns
    the LEFT JOIN into an INNER JOIN and drops the customers without a 1997 order.

- question: "What are the top 3 employees by total revenue generated?"
  difficulty: hard
  category: multi_join_aggregation
  expected_tables: [Employees, Orders, order_details]
  accepted_queries:
    - >
      SELECT e.FirstName, e.LastName,
             SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS Revenue
      FROM Employees e
      JOIN Orders o ON e.EmployeeID = o.EmployeeID
      JOIN order_details od ON o.OrderID = od.OrderID
      GROUP BY e.EmployeeID, e.FirstName, e.LastName ORDER BY Revenue DESC LIMIT 3

- question: "What is the monthly revenue trend for 1997?"
  difficulty: hard
  category: date_aggregation
  expected_tables: [Orders, order_details]
  accepted_queries:
    - >
      SELECT date_format(o.OrderDate, 'MM') AS Month,
             SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS Revenue
      FROM Orders o
      JOIN order_details od ON o.OrderID = od.OrderID
      WHERE year(o.OrderDate) = 1997
      GROUP BY date_format(o.OrderDate, 'MM')
      ORDER BY Month

# ── Ambiguous (tests assumption handling) ─────────────────────────────────────

- question: "Who are our best customers?"
  difficulty: hard
  category: ambiguous
  expected_tables: [Customers, Orders, order_details]
  accepted_queries:
    - >
      SELECT c.CompanyName, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS TotalSpent
      FROM Customers c
      JOIN Orders o ON c.CustomerID = o.CustomerID
      JOIN order_details od ON o.OrderID = od.OrderID
      GROUP BY c.CustomerID, c.CompanyName ORDER BY TotalSpent DESC LIMIT 5
    - >
      SELECT c.CompanyName, COUNT(o.OrderID) AS OrderCount
      FROM Customers c
      JOIN Orders o ON c.CustomerID = o.CustomerID
      GROUP BY c.CustomerID, c.CompanyName ORDER BY OrderCount DESC LIMIT 5
  notes: >
    "Best" is ambiguous — could mean highest revenue, most orders,
    or most recent activity. Agent should state its assumption.

- question: "Which products are underperforming?"
  difficulty: hard
  category: ambiguous
  expected_tables: [Products, order_details]
  accepted_queries:
    - >
      SELECT p.ProductName, SUM(od.Quantity) AS TotalSold
      FROM Products p
      JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY p.ProductID, p.ProductName ORDER BY TotalSold ASC LIMIT 5
    - >
      SELECT p.ProductName, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS Revenue
      FROM Products p
      JOIN order_details od ON p.ProductID = od.ProductID
      GROUP BY p.ProductID, p.ProductName ORDER BY Revenue ASC LIMIT 5
  notes: >
    "Underperforming" is ambiguous — could mean lowest sales volume,
    lowest revenue, or highest stock relative to sales.

- question: "Show me inactive customers"
  difficulty: hard
  category: ambiguous
  expected_tables: [Customers, Orders]
  accepted_queries:
    - >
      SELECT c.CompanyName FROM Customers c
      LEFT JOIN Orders o ON c.CustomerID = o.CustomerID
      WHERE o.OrderID IS NULL
    - >
      SELECT CompanyName FROM Customers
      WHERE CustomerID NOT IN (SELECT CustomerID FROM Orders)
  notes: >
    "Inactive" is ambiguous — could mean never ordered or not ordered
    recently. Agent should state its assumption.

