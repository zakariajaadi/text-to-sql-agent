[project]
name = "text-to-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.10.0",
    "grandalf>=0.8",
    "impyla>=0.24.0",
    "langchain>=1.2.12",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.1",
    "langchain-redis>=0.2.5",
    "langgraph>=1.1.2",
    "langsmith>=0.7.17",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pandas>=3.0.1",
    "pyhive[hive-pure-sasl]>=0.7.0",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.6",
    "redis>=7.4.0",
    "requests>=2.32.5",
    "sqlglot>=30.20.0",
    "sqlparse>=0.5.5",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
