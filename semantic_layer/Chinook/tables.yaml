# Semantic layer, generated (make semantics) and reviewed manually.
# The generator only ADDS missing content, it never overwrites reviewed content.
#   description, columns : business meaning of the table and of each column
#   categorical_columns  : columns holding a closed set of labels (country, status...),
#                          whose values are read from the database at index time.
#                          Remove a column from the list to reject it: it won't come back
#   read_mode, key_columns, partition_column, version_column : Hive table layout
#   formats              : (manual) columns whose values are stored as text,
#                          {column: "date <pattern>" (e.g. date dd/MM/yyyy) or "decimal"}
#   exclude_columns      : (manual) columns the agent never sees (empty, technical, personal data):
#                          out of the documents, the sample rows and the LLM prompts
#   keep_columns         : (manual) columns the profile proposed to exclude, kept visible on purpose
#   keep_as_text         : (manual) columns the profile reads as dates or numbers, kept as text on purpose
#   data_as_of          : (manual) date the data stops (YYYY-MM-DD), reference of relative periods
#   table_type           : (studio) the type of the table chosen by hand (events, entity, reference, bridge),
#                          over the one the studio detects from the profile and the relations
#   edited_description, edited_columns       : (studio) descriptions corrected by hand, kept when the
#                          table is described again (--fresh), unless --replace-edited
#   rewritten_description, rewritten_columns : descriptions the LLM wrote again over another text
#                          (--fresh), to read again; the studio drops them once read

album:
  description: One row per music album.
  categorical_columns: []
  columns:
    albumid: Unique album identifier.
    title: Album title.
    artistid: Artist who created the album.

artist:
  description: One row per artist.
  categorical_columns: []
  columns:
    artistid: Unique artist identifier.
    name: Artist name.

customer:
  description: Represents a customer of the Chinook store.
  categorical_columns: [city, state, country]
  columns:
    customerid: Unique identifier for the customer.
    firstname: Customer first name.
    lastname: Customer last name.
    company: Company name if the customer is a corporate client.
    address: Street address of the customer.
    city: City of the customer.
    state: State or province of the customer.
    country: Country of the customer.
    postalcode: Postal or zip code of the customer.
    phone: Phone number of the customer.
    fax: Fax number of the customer.
    email: Email address of the customer.
    supportrepid: Identifier of the employee assigned to support this customer.

employee:
  description: Represents an employee of the company.
  categorical_columns: [title, city, state, country]
  columns:
    employeeid: Unique identifier for the employee.
    lastname: Employee last name.
    firstname: Employee first name.
    title: Job title of the employee.
    reportsto: Identifier of the manager this employee reports to.
    birthdate: Date of birth of the employee.
    hiredate: Date the employee was hired.
    address: Street address of the employee.
    city: City of the employee.
    state: State or province of the employee.
    country: Country of the employee.
    postalcode: Postal code of the employee.
    phone: Phone number of the employee.
    fax: Fax number of the employee.
    email: Email address of the employee.

genre:
  description: Represents a musical genre category used to classify tracks.
  categorical_columns: [name]
  columns:
    genreid: Unique identifier for the genre.
    name: Descriptive name of the genre.

invoice:
  description: Represents a customer invoice generated for a purchase.
  categorical_columns: [billingcity, billingstate, billingcountry]
  columns:
    invoiceid: Primary key identifying the invoice.
    customerid: Foreign key referencing the customer who made the purchase.
    invoicedate: Date and time the invoice was issued.
    billingaddress: Street address for billing purposes.
    billingcity: City for billing purposes.
    billingstate: State or province for billing purposes.
    billingcountry: Country for billing purposes.
    billingpostalcode: Postal code for billing purposes.
    total: Total amount of the invoice in currency units.

invoiceline:
  description: Represents an individual line item within a customer invoice, detailing a specific track purchased.
  categorical_columns: []
  columns:
    invoicelineid: Unique identifier for the invoice line item.
    invoiceid: Identifier of the invoice this line item belongs to.
    trackid: Identifier of the track purchased in this line item.
    unitprice: Price per unit of the track.
    quantity: Number of units of the track purchased.

mediatype:
  description: Represents the various digital media formats available for tracks.
  categorical_columns: [name]
  columns:
    mediatypeid: Unique identifier for the media type.
    name: Descriptive name of the media format.

playlist:
  description: A playlist represents a collection of tracks grouped together for listening or viewing purposes.
  categorical_columns: [name]
  columns:
    playlistid: Unique identifier for the playlist.
    name: Descriptive title of the playlist.

playlisttrack:
  description: Associative table linking playlists to the tracks they contain.
  categorical_columns: []
  columns:
    playlistid: Identifier of the playlist.
    trackid: Identifier of the track included in the playlist.

track:
  description: Individual music track available in the store.
  categorical_columns: []
  columns:
    trackid: Unique identifier for the track.
    name: Title of the track.
    albumid: Identifier of the album the track belongs to.
    mediatypeid: Identifier of the media format type.
    genreid: Identifier of the music genre.
    composer: Name of the track composer.
    milliseconds: Duration of the track in milliseconds.
    bytes: File size of the track in bytes.
    unitprice: Price of the track per unit.

customer_cdc:
  description: One row per change event captured for a customer record, used for tracking historical updates.
  read_mode: live
  key_columns: [customerid]
  version_column: time
  categorical_columns: [city, country]
  columns:
    customerid: Unique identifier for the customer.
    firstname: First name.
    lastname: Last name.
    city: City.
    country: Country.
    email: Email address.
    time: Timestamp of the change event.
    date_technique: Technical date associated with the record processing.

customer_snapshot:
  description: A historical snapshot of customer profile data at a specific point in time.
  read_mode: last
  partition_column: date_technique
  categorical_columns: [city, state, country]
  columns:
    customerid: Unique identifier for the customer.
    firstname: First name.
    lastname: Last name.
    company: Company name.
    address: Street address.
    city: City.
    state: State or province.
    country: Country.
    postalcode: Postal code.
    phone: Phone number.
    fax: Fax number.
    email: Email address.
    supportrepid: Employee assigned to support this customer.
    time: Timestamp of the snapshot capture.
    date_technique: Technical date associated with the snapshot record.

invoice_delta:
  description: One row per incremental change or update record for an invoice.
  read_mode: all
  partition_column: date_technique
  categorical_columns: [billingcity, billingstate, billingcountry]
  columns:
    invoiceid: Unique identifier for the invoice.
    customerid: Customer associated with the invoice.
    invoicedate: Date and time the invoice was issued.
    billingaddress: Street address for billing.
    billingcity: City for billing.
    billingstate: State or province for billing.
    billingcountry: Country for billing.
    billingpostalcode: Postal code for billing.
    total: Total invoice amount, currency not stated.
    time: Timestamp of the delta record creation.
    date_technique: Technical date associated with the delta processing.
  unclear_columns: [total]
